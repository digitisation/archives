<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flatfile Site</title>
  <style>
    body { font-family: sans-serif; max-width: 42em; margin: 2em auto; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script src="https://unpkg.com/snarkdown/dist/snarkdown.umd.js"></script>
  <script>
    fetch('content.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('app').innerHTML = snarkdown(md);
      })
      .catch(e => {
        document.getElementById('app').textContent = 'Error loading content.';
      });
  </script>
</body>
</html>
